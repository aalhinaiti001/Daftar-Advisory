<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Netlify form detection</title></head>
<body>
  <!-- Static form definitions so Netlify's build-time bot registers the
       JS-rendered forms in the exported app. Not linked from the site. -->
  <form name="calibre-scope" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="text" name="company" />
    <input type="text" name="role" />
    <input type="text" name="hires_per_year" />
    <textarea name="notes"></textarea>
    <input name="bot-field" />
  </form>
  <form name="daftar-scope" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="text" name="organisation" />
    <textarea name="decision"></textarea>
    <input type="text" name="timeline" />
    <input name="bot-field" />
  </form>
</body>
</html>

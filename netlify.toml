[build]
  # Build the Next.js app, then overlay the standalone Calibre design pages:
  #   /calibre + /ar/calibre → Calibre design (EN/AR).
  # The homepage (/) and /ar are now served from the Next app (canon v1.5 source).
  # design/daftar-home.html is retained as a rollback reference only — not built.
  command = "npm run build && cp design/calibre-home.html out/calibre.html && cp design/calibre-home-ar.html out/ar/calibre.html"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

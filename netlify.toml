[build]
  # Build the Next.js app, then serve the standalone Daftar design at "/"
  # (Calibre and the Arabic pages stay on the Next app).
  command = "npm run build && cp design/daftar-home.html out/index.html && cp design/calibre-home.html out/calibre.html"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
